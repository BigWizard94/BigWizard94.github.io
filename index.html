<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bigwizard Media</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: #eeeeee;
            opacity: 0;
            transition: opacity .4s ease;
        }
        body.loaded { opacity: 1; }

        header {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            padding: 40px 20px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .container {
            padding: 20px;
            max-width: 500px;
            margin: auto;
        }

        .card {
            background: #16213e;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid #0f3460;
        }

        h1 { margin: 0; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; }
        h2 { color: #4e9af1; margin-top: 0; }

        ul { padding-left: 20px; color: #b8c1ec; }
        li { margin-bottom: 10px; opacity: 0; transition: opacity .4s ease; }

        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            margin-bottom: 12px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            transition: transform 0.2s;
        }

        .btn-primary { background-color: #4e9af1; color: white; }
        .btn-secondary { background-color: #e94560; color: white; }
        .btn:active { transform: scale(0.98); }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: .9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="brand-name">BIGWIZARD MEDIA</h1>
    </header>

    <div class="container">
        <div class="card">
            <h2>Our Magic</h2>
            <ul id="service-list"></ul>
        </div>

        <a href="https://bigwizardmedia.com" class="btn btn-primary">Visit Website</a>
        <a href="mailto:hello@bigwizardmedia.com" class="btn btn-secondary">Get a Quote</a>
        <a href="https://t.me/bigwizardmedia" class="btn btn-primary">Message on Telegram</a>
    </div>

    <footer>
        © 2026 Bigwizard Media — Creator Tools & Digital Strategy
    </footer>

    <script>
        const config = {
            name: "Bigwizard Media",
            services: [
                "🎬 Video Production",
                "📊 Digital Strategy",
                "📱 Social Media Management",
                "✨ Content Creation"
            ]
        };

        document.getElementById('brand-name').innerText = config.name;

        const listContainer = document.getElementById('service-list');
        config.services.forEach((item, index) => {
            let entry = document.createElement('li');
            entry.innerText = item;
            setTimeout(() => entry.style.opacity = 1, 150 * index);
            listContainer.appendChild(entry);
        });

        window.onload = () => document.body.classList.add('loaded');
    </script>

</body>
</html>
